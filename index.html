<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sahiti’s Planner</title>
  <meta name="description" content="Sahiti’s personal planner: handwriting, calendar, lists and voice notes.">
  <meta name="theme-color" content="#FDF9F5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sahiti’s Planner">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <noscript>Sahiti’s Planner needs JavaScript turned on.</noscript>
  <script>
    // If this browser blocks storage (private mode, preview frames), use memory so the planner still runs.
    (function () {
      function mem() { var d = {}; return { getItem: function (k) { return k in d ? d[k] : null; }, setItem: function (k, v) { d[k] = String(v); }, removeItem: function (k) { delete d[k]; }, clear: function () { d = {}; }, key: function (i) { return Object.keys(d)[i] || null; }, get length() { return Object.keys(d).length; } }; }
      ['localStorage', 'sessionStorage'].forEach(function (name) {
        try { window[name].setItem('__sp', '1'); window[name].removeItem('__sp'); }
        catch (e) { try { Object.defineProperty(window, name, { value: mem(), configurable: true }); } catch (e2) {} }
      });
    })();
  </script>
  <script type="module" src="js/app.js"></script>
  <script>
    // Safety net: if the app has not started after a few seconds (usually old cached files),
    // clear the offline copy once and reload so the newest files load.
    setTimeout(function () {
      if (window.__spBooted) return;
      var tried = false; try { tried = sessionStorage.getItem('sp-heal') === '1'; sessionStorage.setItem('sp-heal', '1'); } catch (e) {}
      if (tried) return;
      // Old copies sit in the browser cache. The offline helper (sw.js) always asks GitHub
      // for fresh files, so start it, let it take over this page, then reload.
      var done = function () { location.replace(location.pathname + '?fresh=' + Date.now() + location.hash); };
      if (!navigator.serviceWorker) return done();
      var clear = window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : Promise.resolve();
      clear.catch(function () {}).then(function () { return navigator.serviceWorker.register('./sw.js'); })
        .then(function (reg) { return reg.update().catch(function () {}).then(function () { return navigator.serviceWorker.ready; }); })
        .then(function () {
          if (navigator.serviceWorker.controller) return done();
          navigator.serviceWorker.addEventListener('controllerchange', done);
          setTimeout(done, 3000);
        }).catch(done);
    }, 5000);
  </script>
</body>
</html>
